name: CI

# Минуты GitHub Actions на исходе (02.11.2026): основная работа — на self-hosted runner владельца
# (Windows, метка tg-local, docs/ci-runner.md). На GitHub-раннерах — только то, что требует Linux/Docker
# (integration) или oasdiff, и только у готового PR (не черновика). Документация в PR CI не запускает.
# Репозиторий публичный: PR из форков и от Dependabot — чужой код (postinstall и т. п.), на машину владельца
# не пускаем: check и audit для них идут на ubuntu-latest, e2e и secrets пропускаются.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  # Push в main проверяется всегда, даже docs-коммит: Render (autoDeployTrigger: checksPass) деплоит
  # коммит без проверок сразу и мог бы выкатить ещё не проверенный код main.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
  TURBO_TELEMETRY_DISABLED: 1

defaults:
  run:
    shell: bash # на Windows-раннере — Git Bash

jobs:
  check:
    name: check + build + load
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","tg-local"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # версия pnpm — из packageManager
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # На self-hosted store pnpm и так на диске; восстановление из кеша GitHub — ~2 мин впустую.
          package-manager-cache: false
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # T1-27: бюджет первого экрана miniapp/admin (gzip), пороги и обоснование — в скрипте.
      - name: Бюджет размера бандла
        run: pnpm check:bundle
      # T1-16: закоммиченные спека и клиент должны совпадать с кодом.
      - name: OpenAPI-спека и клиент актуальны
        run: |
          pnpm api:generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated
          test -z "$(git status --porcelain -- apps/api/openapi.json packages/api-client/src/generated)" || { echo "::error::Спека/клиент устарели: выполните pnpm api:generate и закоммитьте"; exit 1; }
      - name: Нагрузочный сценарий (autocannon, пороги NFR)
        env:
          LOAD_PORT: 4420 # не 4320: на машине владельца может идти локальный прогон
        run: pnpm test:load

  integration:
    # Docker есть только на GitHub-раннере (Testcontainers: PostGIS, Redis). Только у готового PR:
    # после squash в main тот же код не перепроверяем.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-integration-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) }}
    runs-on: [self-hosted, tg-local]
    timeout-minutes: 20
    # Порты не те, что по умолчанию (4310/4311/4320): на машине владельца может идти локальный прогон.
    env:
      E2E_MINIAPP_PORT: 4410
      E2E_ADMIN_PORT: 4411
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Браузеры остаются на машине раннера между запусками; системные зависимости на Windows не нужны.
      - run: pnpm --filter @tg/e2e exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  audit:
    name: audit (зависимости)
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","tg-local"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Без install store pnpm нет — автокеш setup-node валит пост-шаг.
          package-manager-cache: false
      # Падает на high/critical. Установка не нужна — pnpm audit читает lockfile.
      - run: pnpm audit --audit-level=high

  secrets:
    name: secrets (gitleaks)
    if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) }}
    runs-on: [self-hosted, tg-local]
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: da6458e8864af553807de1c46a7a8eac0880bd6b99ba56288e87e86a45af884f
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Бинарь из релиза (MIT), без лицензионного ключа gitleaks-action; сканируется вся история.
      - name: Установить gitleaks
        run: |
          curl -sSfL -o gitleaks.zip "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
          echo "${GITLEAKS_SHA256}  gitleaks.zip" | sha256sum -c -
          unzip -o -q gitleaks.zip gitleaks.exe
          rm gitleaks.zip
      - run: ./gitleaks.exe git --redact --verbose --exit-code 1 .

  openapi-diff:
    name: openapi-diff (ломающие изменения API)
    # Сравниваются закоммиченные спеки базы PR и HEAD; их актуальность проверяет job check.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      OASDIFF_VERSION: 1.33.0
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
      SPEC: apps/api/openapi.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Установить oasdiff
        run: |
          curl -sSfL -o oasdiff.tgz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tgz" | sha256sum -c -
          tar -xzf oasdiff.tgz oasdiff
          rm oasdiff.tgz
      - name: Сравнить с базой PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! git show "${BASE_SHA}:${SPEC}" > base.json 2>/dev/null; then
            echo "В базе PR спеки нет — сравнивать не с чем."; exit 0
          fi
          # Метки читаются через API, а не из события: после добавления метки достаточно Re-run этого job.
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "api-breaking")' | grep -qx true; then
            echo "::warning::PR помечен api-breaking — ломающие изменения разрешены (отчёт ниже)."
            ./oasdiff breaking base.json "$SPEC"
          else
            ./oasdiff breaking base.json "$SPEC" --fail-on ERR
          fi

  # Docker-образы в CI больше не собираем: Render собирает их сам из Dockerfile (автодеплой из main),
  # а в ghcr.io их никто не использовал. Проверка Dockerfile — сборкой на Render.
